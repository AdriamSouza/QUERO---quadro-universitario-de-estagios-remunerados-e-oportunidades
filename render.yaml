databases:
  - name: quero-db
    databaseName: quero_db
    user: quero
    plan: free
    region: ohio

services:
  # 1. Backend RESTful API (Python FastAPI + PostgreSQL 16)
  - type: web
    name: quero-backend
    env: python
    region: ohio
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: quero-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: info
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: STORAGE_PATH
        value: ./data/documentos
      - key: CORS_ORIGINS
        value: "*"
      - key: USE_MOCK_AUTH
        value: "true"

  # 2. Frontend SPA (React + Vite + Tailwind CSS)
  - type: web
    name: quero-frontend
    env: static
    region: ohio
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: quero-backend
          type: web
          property: host
