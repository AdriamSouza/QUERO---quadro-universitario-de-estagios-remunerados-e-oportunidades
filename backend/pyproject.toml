[project]
name = "quero-backend"
version = "5.1.0"
description = "QUERO - Quadro Universitário de Estágios Remunerados e Oportunidades - Backend"
requires-python = ">=3.12"
# Fonte da verdade das dependências: requirements.txt (usado pelo Render e pelo Dockerfile).
dependencies = [
    "fastapi>=0.110.0,<1.0",
    "uvicorn[standard]>=0.28.0,<1.0",
    "pydantic[email]>=2.6.0,<3.0",
    "pydantic-settings>=2.2.0,<3.0",
    "email-validator>=2.1.0,<3.0",
    "sqlalchemy[asyncio]>=2.0.28,<2.1",
    "greenlet>=3.0.3",
    "asyncpg>=0.29.0,<1.0",
    "alembic>=1.13.1,<2.0",
    "python-multipart>=0.0.9",
    "PyJWT>=2.8.0,<3.0",
    "bcrypt>=4.1.0,<6.0",
    "httpx>=0.27.0,<1.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.1.0", "pytest-asyncio>=0.23.5", "locust>=2.24.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
