[project]
name = "quero-backend"
version = "5.0.0"
description = "QUERO - Quadro Universitário de Estágios Remunerados e Oportunidades - Backend RESTful"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic[email]>=2.6.0",
    "pydantic-settings>=2.2.0",
    "email-validator>=2.1.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "greenlet>=3.0.3",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1",
    "httpx>=0.27.0",
    "aiofiles>=23.2.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
